# Local-only visual search taxonomy for specific dish queries.
# This file is documentation/config seed data; runtime code keeps a dependency-free
# fallback copy in personal_lifelog_rag.retrieval.food_taxonomy.
ramen:
  display_name: "ラーメン"
  triggers: ["ラーメン", "らーめん", "ramen"]
  specific_terms:

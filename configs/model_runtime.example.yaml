# Dummy local model runtime example.
# Copy to private_config/model_runtime.yaml and edit manually.
# The app never downloads models automatically.

models:
  vlm:
    engine: "qwen3_vl_transformers"
    model_name: "Qwen/Qwen3-VL-8B-Instruct"
    model_path: null
    device: "auto"
    dtype: "auto"
    local_files_only: true
    prompt_version: "lifelog_structured_tags_v1"
    max_image_size: 1024
    max_new_tokens: 512

  multimodal_embedding:
    engine: "qwen3_vl_embedding_sentence_transformers"
    model_name: "Qwen/Qwen3-VL-Embedding-2B"
    model_path: null
    device: "auto"

face_detection:
  engine: "opencv_yunet"
  model_path: "models/face/face_detection_yunet.onnx"
  local_only: true
  score_threshold: 0.85
  nms_threshold: 0.3
  top_k: 5000
  max_input_size: 1280

face_embedding:
  engine: "opencv_sface"
  model_path: "models/face/sface.onnx"
  embedding_dim: 128
  local_only: true
  normalize: true

face_clustering:
  method: "dbscan_cosine"
  distance_threshold: 0.45
  min_samples: 2

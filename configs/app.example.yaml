app:
  name: personal_lifelog_rag
  local_only: true
  default_year: 2024

database:
  path: data/db/lifelog.sqlite

storage:
  data_dir: data
  raw_photos_dir: data/raw/photos
  raw_line_dir: data/raw/line
  processed_dir: data/processed
  thumbnails_dir: data/thumbnails
  models_dir: models

ingest:
  photos_dir: data/raw/photos
  line_exports_dir: data/raw/line

ocr:
  engine: "tesseract_cli"
  languages: "jpn+eng"
  tesseract_cmd: "tesseract"
  psm: 6
  oem: 1
  min_confidence: 0.0
  max_text_length: 5000
  redact_sensitive: true
  local_only: true

event_building:
  generation_method: rule_based_daily_v2
  photo_gap_minutes: 90
  line_gap_minutes: 120
  merge_window_minutes: 90
  gps_distance_meters: 500

models:
  vlm:
    provider: null
    engine: null
    model_name: null
    model_path: null
    device: "auto"
    dtype: "auto"
    local_files_only: true
    max_image_size: 1024
    prompt_version: "qwen3_vl_lifelog_v1"
    max_new_tokens: 512

  multimodal_embedding:
    provider: null
    engine: null
    model_name: null
    model_path: null
    device: "auto"
    embedding_dim: null
    batch_size: 4

face_detection:
  engine: "opencv_yunet"
  model_path: "models/face/face_detection_yunet.onnx"
  local_only: true
  score_threshold: 0.85
  nms_threshold: 0.3
  top_k: 5000
  max_input_size: 1280

face_embedding:
  engine: "opencv_sface"
  model_path: "models/face/sface.onnx"
  embedding_dim: 128
  local_only: true
  normalize: true

face_clustering:
  method: "dbscan_cosine"
  distance_threshold: 0.45
  min_samples: 2

privacy:
  allow_network: false
  bind_host: 127.0.0.1
  persist_raw_exports: true
